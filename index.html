<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DANS ET! · Financial Fragility and Economic Crises in Türkiye (1990–2001)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- PowerPoint eklentisi olarak açıldığında kamera izni için gerekli -->
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--pink:#ff3fa4;--cyan:#22e3ff;--yellow:#ffe14d;--gold:#ffc93c;--green:#58ff8a;--red:#ff5a5a;--line:rgba(255,255,255,.22)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font-family:"Baloo 2",system-ui,sans-serif}
  #stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  #frame{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;overflow:hidden;container-type:size}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  #ui{position:absolute;inset:0;pointer-events:none}
  .score{position:absolute;top:2.2cqh;left:2cqw;font-size:6cqh;font-weight:800;line-height:1;text-shadow:0 .4cqh 0 rgba(0,0,0,.4)}
  .combo{position:absolute;top:9cqh;left:2cqw;font-size:3cqh;color:var(--yellow);font-weight:700}
  #meter{position:absolute;top:2.6cqh;right:2cqw;width:22cqw}
  #meter .bar{height:2cqh;border-radius:1cqh;background:rgba(255,255,255,.15);overflow:hidden}
  #meter .fill{height:100%;width:0;background:linear-gradient(90deg,#ff5a5a,#22e3ff,#ffe14d);transition:width .1s}
  #meter .lbl{font-size:1.8cqh;opacity:.85;text-align:right}
  #prog{position:absolute;top:0;left:0;height:.7cqh;width:0;background:linear-gradient(90deg,var(--pink),var(--cyan))}
  #moveName{position:absolute;top:7cqh;left:0;right:0;text-align:center;font-size:3.6cqh;font-weight:800;text-shadow:0 .3cqh 1.4cqh rgba(0,0,0,.8)}
  #goldWarn{position:absolute;top:12cqh;left:0;right:0;text-align:center;font-size:3.6cqh;font-weight:800;color:var(--gold);text-shadow:0 0 2cqh rgba(255,201,60,.9);opacity:0}
  #goldWarn.on{opacity:1;animation:blink .5s infinite alternate}
  @keyframes blink{to{opacity:.35}}
  #lyric{position:absolute;left:0;right:24cqw;bottom:22cqh;text-align:center;font-size:3.6cqh;font-weight:800;text-shadow:0 .3cqh 1.6cqh rgba(0,0,0,.9)}
  #lyric span{background:rgba(10,4,30,.55);padding:.2cqh 1.6cqh;border-radius:1.6cqh}
  #info{position:absolute;top:15cqh;left:2cqw;max-width:34cqw;background:rgba(10,4,30,.8);border:.25cqh solid var(--cyan);border-radius:1.8cqh;padding:1.2cqh 1.6cqh;font-size:2.2cqh;line-height:1.3;transform:translateX(-130%);transition:transform .45s}
  #info.on{transform:none}
  #info b{display:block;color:var(--yellow);font-size:2.8cqh}
  #cards{position:absolute;left:1.5cqw;bottom:2cqh;width:72cqw;height:18cqh}
  #cam{position:absolute;right:1.5cqw;bottom:2cqh;width:22cqw;height:18cqh;border-radius:1.6cqh;border:.3cqh solid rgba(255,255,255,.65);background:#000}
  #pops{position:absolute;inset:0;width:100%;height:100%}
  .overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:2cqh;background:rgba(6,2,20,.82);pointer-events:auto;text-align:center;padding:3cqh}
  .overlay.on{display:flex}
  .logo{font-size:10cqh;font-weight:800;line-height:1;background:linear-gradient(90deg,var(--pink),var(--yellow),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;transform:rotate(-2deg)}
  .sub{font-size:3cqh;font-weight:700;max-width:80cqw}
  .st{font-size:2.2cqh;opacity:.85;max-width:70cqw}
  .row{display:flex;gap:1.5cqw;align-items:center;justify-content:center;flex-wrap:wrap}
  .btn{border:0;border-radius:1.8cqh;padding:1.4cqh 2.6cqh;font:inherit;font-size:2.6cqh;font-weight:700;color:#1a0b3d;background:var(--yellow);cursor:pointer;box-shadow:0 .5cqh 0 rgba(0,0,0,.25)}
  .btn.ghost{background:transparent;color:#fff;border:.25cqh solid var(--line);box-shadow:none}
  .btn.big{font-size:4.2cqh;padding:1.4cqh 6cqh;background:linear-gradient(90deg,var(--pink),#ff7a3f);color:#fff;box-shadow:0 .8cqh 0 #8a1550}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .stars{font-size:8cqh;letter-spacing:1cqh}.stars .off{opacity:.2}
  .tally{display:flex;gap:1.4cqh;flex-wrap:wrap;justify-content:center;font-size:2.6cqh}
  .tally div{background:rgba(255,255,255,.08);border:.15cqh solid var(--line);border-radius:1.4cqh;padding:.6cqh 1.6cqh}
  #count .big3{font-size:18cqh;font-weight:800}
</style>
</head>
<body>
<div id="stage"><div id="frame">
  <video id="v" playsinline preload="auto"></video>
  <div id="ui">
    <div id="prog"></div>
    <div class="score" id="score">0</div><div class="combo" id="combo"></div>
    <div id="meter"><div class="lbl">match</div><div class="bar"><div class="fill" id="fill"></div></div></div>
    <div id="moveName"></div>
    <div id="goldWarn">★ GOLD MOVE COMING ★</div>
    <div id="info"></div>
    <div id="lyric"></div>
    <canvas id="cards"></canvas>
    <canvas id="cam" width="480" height="270"></canvas>
    <canvas id="pops"></canvas>
  </div>
  <div class="overlay on" id="menu">
    <div class="logo">DANS ET!</div>
    <div class="sub" id="title">Financial Fragility and Economic Crises in Türkiye (1990–2001)</div>
    <div class="st">Copy Sidar like a mirror. Stand 2–3 m from the camera so your arms are visible. Gold cards score ×3.</div>
    <div class="row"><button class="btn" id="camBtn">Turn on camera</button><span class="st" id="camSt"></span></div>
    <div class="row"><button class="btn big" id="startBtn" disabled>PLAY!</button><button class="btn ghost" id="watchBtn" disabled>Watch only</button></div>
    <div class="st" id="loadSt">Loading…</div>
  </div>
  <div class="overlay" id="count"><div class="big3" id="countN">3</div></div>
  <div class="overlay" id="results">
    <div class="logo" id="resTitle" style="font-size:8cqh">AMAZING!</div>
    <div class="stars" id="stars"></div>
    <div style="font-size:9cqh;font-weight:800;line-height:1" id="final">0</div>
    <div class="tally" id="tally"></div>
    <div class="row"><button class="btn big" id="againBtn" style="font-size:3cqh">Play again</button></div>
  </div>
</div></div>

<script type="module">
/* ============ AYARLAR ============ */
const P = new URLSearchParams(location.search);
const SET = P.get("set") || "test";                 // data/<set>.json ve video/<set>.mp4
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
const V = $("v");
let D = null;                                      // veri: moves, olaylar, aci, fps, ekran

/* ============ OFFICE (PowerPoint Online) ============ */
let inOffice = false;
async function officeReady(){
  if (!window.Office) return;
  try { const info = await Office.onReady(); inOffice = !!(info && info.host); } catch(e){}
}
async function officeCameraPermission(){
  try{
    if (inOffice && Office.context && Office.context.platform === Office.PlatformType.OfficeOnline && Office.devicePermission){
      return await Office.devicePermission.requestPermissions([Office.DevicePermissionType.camera]);
    }
  }catch(e){ console.warn("devicePermission", e); }
  return true;
}

/* ============ KAMERA + MEDIAPIPE ============ */
const MP = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const cv = document.createElement("video"); cv.playsInline = true; cv.muted = true;
let landmarker = null, camOn = false, lastVT = -1, userLm = null, lmAge = 0;
async function startCamera(){
  const st = $("camSt");
  try{
    st.textContent = "Waiting for camera permission…";
    const ok = await officeCameraPermission();
    if (ok === false){ st.textContent = "Camera permission was denied."; return; }
    const stream = await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720},facingMode:"user"},audio:false});
    cv.srcObject = stream; await cv.play();
    st.textContent = "Loading pose detection…";
    const { PoseLandmarker, FilesetResolver } = await import(MP + "/vision_bundle.mjs");
    const fs = await FilesetResolver.forVisionTasks(MP + "/wasm");
    const make = d => PoseLandmarker.createFromOptions(fs, {baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task", delegate:d}, runningMode:"VIDEO", numPoses:1});
    try { landmarker = await make("GPU"); } catch(e){ landmarker = await make("CPU"); }
    camOn = true; $("camBtn").style.display = "none"; st.textContent = "Camera ready ✔"; updateStart();
  }catch(err){
    console.error(err);
    st.textContent = "Camera could not start (" + (err.name||err.message) + "). You can still use Watch only.";
  }
}
function detect(){
  if (!camOn || cv.readyState < 2 || cv.currentTime === lastVT) return;
  lastVT = cv.currentTime;
  const r = landmarker.detectForVideo(cv, performance.now());
  const w = cv.videoWidth, h = cv.videoHeight;
  if (r.landmarks && r.landmarks[0]){ userLm = r.landmarks[0].map(p => ({x:(1-p.x)*w, y:p.y*h, v:p.visibility ?? 1})); lmAge = performance.now(); }
  else if (performance.now() - lmAge > 400) userLm = null;
}
const camCtx = $("cam").getContext("2d");
const BONES2D = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
const SEGKEY = {"11-13":"la","13-15":"lf","12-14":"ra","14-16":"rf","23-25":"lt","24-26":"rt"};
function drawCam(per){
  const W = 480, H = 270, c = camCtx;
  c.fillStyle = "#000"; c.fillRect(0,0,W,H);
  if (!camOn){ c.fillStyle="rgba(255,255,255,.7)"; c.font="700 24px 'Baloo 2'"; c.textAlign="center"; c.fillText(G && G.watch ? "Watch mode" : "Camera off", W/2, H/2+8); return; }
  const vw = cv.videoWidth||16, vh = cv.videoHeight||9, sc = Math.max(W/vw, H/vh), dw = vw*sc, dh = vh*sc, dx = (W-dw)/2, dy = (H-dh)/2;
  c.save(); c.translate(dx+dw, dy); c.scale(-1,1); c.drawImage(cv, 0, 0, dw, dh); c.restore();
  if (userLm){
    c.lineCap = "round"; c.lineWidth = 5;
    for (const [a,b] of BONES2D){
      if (userLm[a].v<.3||userLm[b].v<.3) continue;
      const k = SEGKEY[a+"-"+b]; c.strokeStyle = (per && k && per[k]!==undefined) ? `hsl(${Math.round(per[k]*120)},95%,60%)` : "rgba(255,255,255,.8)";
      c.beginPath(); c.moveTo(dx+userLm[a].x*sc, dy+userLm[a].y*sc); c.lineTo(dx+userLm[b].x*sc, dy+userLm[b].y*sc); c.stroke();
    }
  } else { c.fillStyle="rgba(0,0,0,.55)"; c.fillRect(0,H/2-22,W,44); c.fillStyle="#fff"; c.font="700 22px 'Baloo 2'"; c.textAlign="center"; c.fillText("I can't see you!", W/2, H/2+8); }
}

/* ============ PUANLAMA ============ */
const SEGS = [ [[11,13],"la",1,false], [[13,15],"lf",1,false], [[12,14],"ra",1,false], [[14,16],"rf",1,false], [[23,25],"lt",.6,true], [[24,26],"rt",.6,true] ];
const angDiff = (a,b) => Math.abs(((a-b+540)%360)-180);
function refAngles(t){
  const i = clamp(Math.round(t*D.fps), 0, D.aci.length-1), a = D.aci[i], o = {};
  D.aci_sira.forEach((k,j) => { if (a[j] !== null) o[k] = a[j]; });
  return o;
}
function matchPose(lm, dA){
  if (!lm) return {score:0, per:{}};
  let tot=0, ws=0; const per={};
  for (const [[ia,ib],k,w,isLeg] of SEGS){
    const p=lm[ia], q=lm[ib]; if (dA[k]===undefined) continue;
    const vis = Math.min(p.v, q.v);
    if (isLeg && vis < 0.5) continue;
    let s = 0;
    if (vis >= 0.25){ const ang = Math.atan2(q.y-p.y, q.x-p.x)*180/Math.PI; s = clamp(1 - (angDiff(ang, dA[k]) - 18)/55, 0, 1); }
    per[k]=s; tot+=s*w; ws+=w;
  }
  return {score: ws? tot/ws : 0, per};
}
const RATINGS = [{name:"PERFECT",min:.78,pts:1000,color:"#ffe14d"},{name:"SUPER",min:.6,pts:700,color:"#58ff8a"},{name:"GOOD",min:.4,pts:400,color:"#22e3ff"},{name:"MISS",min:-1,pts:0,color:"#ff5a5a"}];
let G = null;
function judge(m){
  m.done = true; let r;
  if (G.watch) r = RATINGS[0];
  else { const sc = m.scores.sort((a,b)=>b-a), top = sc.slice(0, Math.max(1, Math.ceil(sc.length*.5))); const val = top.length ? top.reduce((a,b)=>a+b,0)/top.length : 0; r = RATINGS.find(r => val >= r.min); }
  m.rating = r; m.fx = performance.now(); G.counts[r.name]++;
  if (r.pts){ G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo); } else G.combo = 0;
  const kat = (m.altin && r.pts) ? 3 : 1;
  G.score += Math.round(r.pts*kat*(1+Math.min(G.combo,20)*.05));
  if (m.altin && r.pts){ G.gold++; G.pop.push({text:"GOLD ×3!", color:"#ffc93c", t:performance.now(), big:true}); burst(); }
  else G.pop.push({text:r.name, color:r.color, t:performance.now()});
}
function burst(){ const now = performance.now(), W = $("pops").width, H = $("pops").height; for (let i=0;i<90;i++) G.burst.push({x:W/2, y:H*.45, vx:(Math.random()-.5)*16, vy:-Math.random()*14-3, t:now, c:Math.random()<.5?"#ffc93c":"#fff3b0"}); }

/* ============ OYUN AKIŞI ============ */
function updateStart(){ $("startBtn").disabled = !(camOn && D); $("watchBtn").disabled = !D; }
function start(watch){
  G = {watch, score:0, combo:0, maxCombo:0, gold:0, counts:{PERFECT:0,SUPER:0,GOOD:0,MISS:0}, live:0, per:null, pop:[], burst:[], ev:0, hist:[]};
  D.moves.forEach(m => { m.done=false; m.scores=[]; m.rating=null; });
  $("menu").classList.remove("on"); $("results").classList.remove("on"); $("info").classList.remove("on"); $("lyric").innerHTML="";
  V.currentTime = 0; $("count").classList.add("on");
  let n = 3; $("countN").textContent = n;
  const tm = setInterval(() => { n--; if (n > 0) $("countN").textContent = n; else { clearInterval(tm); $("count").classList.remove("on"); V.play(); G.state = "play"; } }, 800);
  G.state = "count";
}
function fireEvents(t){
  const O = D.olaylar;
  while (G.ev < O.length && t >= O[G.ev].t - 0.02){
    const e = O[G.ev++];
    if (e.soz) $("lyric").innerHTML = `<span>${e.soz}</span>`;
    if (e.bilgi){ $("info").innerHTML = `<b>${e.bilgi[0]}</b>${e.bilgi[1]}`; $("info").classList.add("on"); G.infoUntil = t + 6; }
    $("goldWarn").classList.toggle("on", !!e.altinUyari);
  }
  if (G.infoUntil && t > G.infoUntil){ $("info").classList.remove("on"); G.infoUntil = 0; }
}
function end(){
  G.state = "end"; $("goldWarn").classList.remove("on");
  const max = D.moves.reduce((a,m)=>a+(m.altin?3000:1000),0), base = D.moves.reduce((a,m)=>a+(m.rating?m.rating.pts*(m.altin?3:1):0),0), ratio = max? base/max : 0;
  const stars = [.25,.4,.55,.7,.85].filter(x => ratio >= x).length;
  $("stars").innerHTML = Array.from({length:5},(_,i)=>`<span class="${i<stars?"":"off"}">★</span>`).join("");
  $("final").textContent = G.score.toLocaleString("en-US");
  $("tally").innerHTML = RATINGS.map(r=>`<div style="color:${r.color}">${r.name}: <b>${G.counts[r.name]}</b></div>`).join("") + `<div style="color:#ffc93c">Gold: <b>${G.gold}/${D.moves.filter(m=>m.altin).length}</b></div><div>Best combo: <b>${G.maxCombo}</b></div>`;
  $("resTitle").textContent = G.watch ? "THE END!" : stars>=4 ? "AMAZING!" : stars>=2 ? "GREAT JOB!" : "TRY AGAIN!";
  $("results").classList.add("on");
}
V.addEventListener("ended", () => { if (G && G.state === "play") end(); });
$("camBtn").onclick = startCamera;
$("startBtn").onclick = () => start(false);
$("watchBtn").onclick = () => start(true);
$("againBtn").onclick = () => start(G?.watch);

/* ============ KARTLAR ============ */
const cardsCtx = $("cards").getContext("2d"), LOOK = 4.0;
function drawCards(t){
  const cvs = $("cards"), c = cardsCtx, W = cvs.width, H = cvs.height, d = H/150;
  c.clearRect(0,0,W,H); c.fillStyle = "rgba(0,0,0,.35)"; c.beginPath(); c.roundRect(0,0,W,H,22*d); c.fill();
  if (!D) return;
  const box = H*.86, hitX = 14*d + box/2, pps = (W - hitX - box/2)/LOOK, now = performance.now();
  c.save(); c.strokeStyle="#fff"; c.lineWidth=4*d; c.shadowColor="#fff"; c.shadowBlur=14*d; c.beginPath(); c.roundRect(hitX-box/2-4*d,(H-box)/2-4*d,box+8*d,box+8*d,18*d); c.stroke(); c.restore();
  for (const m of D.moves){
    const dt = m.t - t; if (dt > LOOK+.5) break;
    let x = hitX + dt*pps, a = 1, s = 1;
    if (m.done){ const age=(now-m.fx)/1000; if (age>.5) continue; x=hitX; a=1-age/.5; s=1+age*.6; }
    else if (dt < 0) x = hitX;
    const b = box*s, y = (H-b)/2;
    c.save(); c.globalAlpha = a;
    if (m.altin){ c.shadowColor = "#ffc93c"; c.shadowBlur = (18 + 10*Math.sin(now/120))*d; }
    c.fillStyle = m.done ? m.rating.color+"55" : (m.altin ? "rgba(255,201,60,.25)" : "rgba(255,255,255,.08)");
    c.strokeStyle = m.done ? m.rating.color : (m.altin ? "#ffc93c" : "#ff3fa4"); c.lineWidth = (m.altin?5:3)*d;
    c.beginPath(); c.roundRect(x-b/2, y, b, b, 16*d); c.fill(); c.stroke(); c.shadowBlur = 0;
    if (m.im && m.im.complete) c.drawImage(m.im, x-b*.45, y+b*.04, b*.9, b*.92);
    if (m.altin && !m.done){ c.fillStyle="#ffc93c"; c.font=`800 ${Math.round(14*d)}px 'Baloo 2'`; c.textAlign="center"; c.fillText("GOLD", x, y+16*d); }
    c.restore();
  }
}
function drawPops(now){
  const cvs = $("pops"), c = cvs.getContext("2d"), W = cvs.width, H = cvs.height;
  c.clearRect(0,0,W,H); if (!G) return;
  G.pop = G.pop.filter(p => now - p.t < 900);
  for (const p of G.pop){ const a=(now-p.t)/900; c.save(); c.globalAlpha=1-a; c.textAlign="center"; c.font=`800 ${Math.round(H*(p.big?.12:.09)*(1+a*.3))}px 'Baloo 2'`; c.fillStyle=p.color; c.shadowColor=p.color; c.shadowBlur=30; c.fillText(p.text, p.big?W*.5:W*.3, H*.32-a*40); c.restore(); }
  G.burst = G.burst.filter(b => now - b.t < 1400);
  for (const b of G.burst){ const s=(now-b.t)/16; c.fillStyle=b.c; c.globalAlpha=1-(now-b.t)/1400; c.fillRect(b.x+b.vx*s, b.y+b.vy*s+0.25*s*s, 7, 7); }
  c.globalAlpha = 1;
}

/* ============ ANA DÖNGÜ ============ */
function loop(){
  requestAnimationFrame(loop);
  detect();
  const now = performance.now(), t = V.currentTime || 0;
  if (G && D && G.state === "play"){
    fireEvents(t);
    const ref = refAngles(Math.max(0, t - 0.25));                // oyuncuya 0,25 sn tepki payı
    const r = G.watch ? {score:1, per:null} : matchPose(userLm, ref); G.per = r.per; G.live = lerp(G.live, r.score, .3);
    for (const m of D.moves){
      if (m.done) continue;
      if (t > m.t + .25){ judge(m); continue; }
      if (t >= m.t - m.len*.8) m.scores.push(r.score);
      break;
    }
    const cur = D.moves.find(m => !m.done);
    $("moveName").textContent = cur ? (cur.altin ? "★ " + cur.ad + " ★" : cur.ad) : "";
    $("moveName").style.color = cur && cur.altin ? "#ffc93c" : "#fff";
    $("score").textContent = G.score.toLocaleString("en-US");
    $("combo").textContent = G.combo >= 3 ? `${G.combo} COMBO!` : "";
    $("fill").style.width = (G.live*100) + "%";
    $("prog").style.width = (clamp(t/(V.duration||1),0,1)*100) + "%";
  }
  drawCam(G?.per); drawCards(t); drawPops(now);
}
function resize(){
  for (const id of ["cards","pops"]){ const c = $(id); c.width = c.clientWidth*devicePixelRatio; c.height = c.clientHeight*devicePixelRatio; }
}
addEventListener("resize", resize);

/* ============ YÜKLEME ============ */
(async () => {
  resize(); loop();
  await officeReady();
  try{
    D = await (await fetch(`data/${SET}.json`, {cache:"no-cache"})).json();
    if (D.baslik) $("title").textContent = D.baslik;
    D.moves.forEach(m => { m.im = new Image(); m.im.src = m.img; });
    V.src = `video/${SET}.mp4`;
    await new Promise((res, rej) => { V.oncanplay = res; V.onerror = () => rej(new Error("video")); });
    $("loadSt").textContent = inOffice ? "Ready ✔ (running inside PowerPoint)" : "Ready ✔";
    updateStart();
  }catch(e){ console.error(e); $("loadSt").textContent = "Could not load: " + e.message; }
})();
</script>
